# The part of .github/dependabot.yml every lolaf-org Maven repository shares. It cannot be imported:
# each repository keeps its own file, which must contain all of this, and may add to it.
# The dependabot drift workflow checks that weekly.

version: 2

updates:
  # In a consuming repository this is only the lolaf-org/workflows references; every other action is
  # bumped once, here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

    # Without grouping this is two dozen pinned versions arriving one pull request at a time
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.sonatype.central:*"
          - "com.mycila:license-maven-plugin"
          - "org.projectlombok:lombok-maven-plugin"
      test-libraries:
        patterns:
          - "org.junit:*"
          - "org.junit.jupiter:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.awaitility:*"

    # Majors are a decision, not a weekly chore.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
